<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVGmap: SVG city map generator for laser engraving, pen plotters and print</title>
    <meta
      name="description"
      content="Make SVG maps of any city from OpenStreetMap data. Pick a place and a size, then download a file ready for a laser cutter, pen plotter or printer. Free and runs in the browser."
    />
    <link rel="canonical" href="https://svgmap.jarvisar.com/" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="SVGmap" />
    <meta name="theme-color" content="#2b7bd6" />

    <!-- Link previews. These need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVGmap" />
    <meta property="og:title" content="SVGmap: SVG city maps for laser engraving, pen plotters and print" />
    <meta property="og:description" content="Make SVG maps of any city from OpenStreetMap data, ready for a laser cutter, pen plotter or printer." />
    <meta property="og:url" content="https://svgmap.jarvisar.com/" />
    <meta property="og:image" content="https://svgmap.jarvisar.com/preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="SVGmap preview of downtown Chicago" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SVGmap",
        "url": "https://svgmap.jarvisar.com/",
        "description": "Make SVG maps of any city from OpenStreetMap data for laser engraving, pen plotters and print.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "screenshot": "https://svgmap.jarvisar.com/preview.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SVGmap",
        "url": "https://svgmap.jarvisar.com/"
      }
    </script>
    <style>
      .boot {
        max-width: 420px;
        margin: 20vh auto 0;
        padding: 0 16px;
        color: #6f6f6f;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .boot h1 {
        margin: 0 0 8px;
        font-size: 16px;
        color: #222;
      }
      .boot a {
        color: #2b7bd6;
      }
    </style>
    <!-- Cloudflare Web Analytics. Only on the live site, so local dev aren't counted -->
    <script>
      if (location.hostname === 'svgmap.jarvisar.com') {
        const beacon = document.createElement('script');
        beacon.type = 'module';
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        beacon.dataset.cfBeacon = '{"token": "a52a84e110ba48c0868dd4ae87e235b7"}';
        document.head.appendChild(beacon);
      }
    </script>
  </head>
  <body>
    <!-- Shown while the app loads and replaced when it mounts. Also the only text crawlers see without running JS. -->
    <div id="root">
      <div class="boot">
        <h1>SVGmap</h1>
        <p>
          Make SVG maps of any city from OpenStreetMap data, for laser engraving, pen plotters and print. Pick a place
          and a size, then download a file ready for your laser cutter, plotter or printer.
        </p>
        <noscript><p>SVGmap needs JavaScript to run.</p></noscript>
        <p><a href="about">About SVGmap</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
